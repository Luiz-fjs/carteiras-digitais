services:
  postgres:
    image: postgres:16-alpine
    container_name: accesschain-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accesschain}
      POSTGRES_USER: ${POSTGRES_USER:-accesschain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accesschain_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: accesschain-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@accesschain.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    depends_on:
      - postgres

volumes:
  pgdata:
